# Keeps the SHA-pinned actions and the dev dependencies (TypeScript, Node types)
# current.
# Updates wait 7 days after a release (cooldown), so a bad or hijacked version
# has time to be pulled before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
