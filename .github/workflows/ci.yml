name: CI

# Checks the repository against itself: links and anchors between the
# standards, the baseline's consistency with the drift check, the scripts'
# syntax, and zizmor on every workflow here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Script syntax
        run: |
          node --check baseline/drift-check.mjs
          node --check baseline/self-check.mjs
          node --check skills/typescript-strict/scripts/scan-escape-hatches.mjs

      - name: Links, anchors and baseline consistency
        run: node baseline/self-check.mjs

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false

      - name: Scan workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from 'zizmor==1.31.1' zizmor --format github .github/workflows
