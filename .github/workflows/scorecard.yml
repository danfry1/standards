name: OpenSSF Scorecard (reusable)

# Reusable OpenSSF Scorecard analysis. Call it from a repo:
#
#   jobs:
#     scorecard:
#       permissions: { security-events: write, id-token: write }
#       uses: danfry1/standards/.github/workflows/scorecard.yml@<sha> # vX.Y.Z
#
# Pin the call by commit SHA (see ../../github-actions.md, rule 1); @v1
# remains for existing callers.
on:
  workflow_call:
    inputs:
      publish_results:
        description: Publish results to the OpenSSF API (enables the badge).
        type: boolean
        default: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
