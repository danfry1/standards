<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="standards: a spirit level, bubble centred">
  <title>standards</title>
  <!-- body -->
  <rect x="3" y="11" width="194" height="42" rx="11" fill="#161b22" stroke="#e6edf3" stroke-width="3.5"/>
  <!-- graduations -->
  <g stroke="#e6edf3" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="22" y1="43" x2="22" y2="47"/><line x1="32" y1="40" x2="32" y2="47"/><line x1="42" y1="43" x2="42" y2="47"/><line x1="52" y1="43" x2="52" y2="47"/>
    <line x1="148" y1="43" x2="148" y2="47"/><line x1="158" y1="43" x2="158" y2="47"/><line x1="168" y1="40" x2="168" y2="47"/><line x1="178" y1="43" x2="178" y2="47"/>
  </g>
  <!-- vial -->
  <rect x="66" y="21" width="68" height="22" rx="11" fill="#3fb950"/>
  <!-- bubble, dead centre -->
  <ellipse cx="100" cy="30.5" rx="11" ry="6" fill="#0d1117"/>
  <!-- level marks -->
  <g stroke="#e6edf3" stroke-width="3" stroke-linecap="round">
    <line x1="86" y1="17" x2="86" y2="47"/><line x1="114" y1="17" x2="114" y2="47"/>
  </g>
</svg>
